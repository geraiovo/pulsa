<style>
:root {
  --bg: #060d09;
  --bg2: #0c1a12;
  --card: #111e17;
  --card2: #172820;
  --accent: #00e676;
  --accent2: #00c853;
  --accent-glow: rgba(0,230,118,0.12);
  --text: #dff0e6;
  --text2: #a3c4ae;
  --muted: #4a6e56;
  --border: #1b3326;
  --danger: #ff5252;
  --warn: #ffab40;
  --info: #26c6da;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
h1,h2,h3,h4,h5 { font-family: 'Outfit', sans-serif; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
.accent-grad {
  background: linear-gradient(135deg, var(--accent), #00bfa5);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), #00bfa5);
  color: #060d09; font-weight: 700; border: none; border-radius: 12px;
  padding: 12px 28px; cursor: pointer; font-size: 15px;
  transition: all .2s; box-shadow: 0 4px 24px rgba(0,230,118,0.2);
  font-family: 'DM Sans', sans-serif;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 32px rgba(0,230,118,0.35); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.btn-outline {
  background: transparent; color: var(--accent); font-weight: 600;
  border: 2px solid var(--accent); border-radius: 12px;
  padding: 10px 24px; cursor: pointer; font-size: 14px;
  transition: all .2s; font-family: 'DM Sans', sans-serif;
}
.btn-outline:hover { background: var(--accent-glow); }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px; transition: all .25s;
}
.card:hover { border-color: rgba(0,230,118,0.3); }
.card-select {
  cursor: pointer; position: relative; overflow: hidden;
}
.card-select::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,230,118,0.08), transparent);
  opacity: 0; transition: opacity .25s;
}
.card-select:hover::before, .card-select.active::before { opacity: 1; }
.card-select.active { border-color: var(--accent); box-shadow: 0 0 20px rgba(0,230,118,0.15); }
.input-field {
  background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 12px 16px; color: var(--text);
  font-size: 15px; width: 100%; outline: none; transition: border .2s;
  font-family: 'DM Sans', sans-serif;
}
.input-field:focus { border-color: var(--accent); }
.input-field::placeholder { color: var(--muted); }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
}
.badge-success { background: rgba(0,230,118,0.15); color: var(--accent); }
.badge-pending { background: rgba(255,171,64,0.15); color: var(--warn); }
.badge-fail { background: rgba(255,82,82,0.15); color: var(--danger); }
.badge-info { background: rgba(38,198,218,0.15); color: var(--info); }
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--card2); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 20px; min-width: 300px; display: flex; align-items: center; gap: 10px;
  animation: slideIn .3s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.toast.out { animation: slideOut .3s ease forwards; }
@keyframes slideIn { from { transform: translateX(100%); opacity:0; } to { transform: translateX(0); opacity:1; } }
@keyframes slideOut { from { transform: translateX(0); opacity:1; } to { transform: translateX(100%); opacity:0; } }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 8000;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s ease; padding: 20px;
}
.modal-box {
  background: var(--card); border: 1px solid var(--border); border-radius: 20px;
  padding: 28px; max-width: 520px; width: 100%; max-height: 80vh; overflow-y: auto;
  animation: scaleIn .25s ease;
}
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes scaleIn { from { transform: scale(.9); opacity:0; } to { transform: scale(1); opacity:1; } }
.glow-orb {
  position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none;
  animation: orbFloat 8s ease-in-out infinite;
}
@keyframes orbFloat {
  0%,100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(30px,-20px) scale(1.1); }
  66% { transform: translate(-20px,30px) scale(0.9); }
}
.step-indicator { display: flex; gap: 4px; align-items: center; }
.step-dot {
  width: 32px; height: 4px; border-radius: 2px; background: var(--border);
  transition: all .3s;
}
.step-dot.active { background: var(--accent); width: 48px; }
.step-dot.done { background: var(--muted); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 12px 16px; font-size: 12px; text-transform: uppercase;
  letter-spacing: .5px; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 600; }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text2); }
tr:hover td { background: rgba(0,230,118,0.03); }
.skeleton { background: linear-gradient(90deg, var(--bg2) 25%, var(--card) 50%, var(--bg2) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.nav-link { position: relative; color: var(--text2); transition: color .2s; cursor: pointer; font-weight: 500; }
.nav-link:hover, .nav-link.active { color: var(--accent); }
.nav-link.active::after {
  content: ''; position: absolute; bottom: -4px; left: 0; right: 0;
  height: 2px; background: var(--accent); border-radius: 1px;
}
.countdown { font-variant-numeric: tabular-nums; }
@media (max-width: 768px) {
  .toast { min-width: 260px; font-size: 13px; }
  .modal-box { padding: 20px; }
  td, th { padding: 8px 10px; font-size: 12px; }
}
.pulse-ring {
  animation: pulseRing 2s ease-out infinite;
}
@keyframes pulseRing {
  0% { box-shadow: 0 0 0 0 rgba(0,230,118,0.4); }
  70% { box-shadow: 0 0 0 12px rgba(0,230,118,0); }
  100% { box-shadow: 0 0 0 0 rgba(0,230,118,0); }
}
</style>
</head>

<script>
// ============================================================
// KONFIGURASI — Ganti value di sini untuk koneksi API sungguhan
// ============================================================
const CONFIG = {
  // Digiflazz: ganti dengan API key & username asli Anda
  digiflazz: {
    username: 'tokuyoD7BwMo',   // ← ganti
    apiKey: '793dc432-2128-516c-8645-4828080b0bea',      // ← ganti
    baseUrl: 'https://api.digiflazz.com/v1'
  },
  // Tripay: ganti dengan credential Tripay Anda
  tripay: {
    apiKey: 'tripay_api_key',     // ← ganti
    privateKey: 'tripay_private', // ← ganti
    merchantCode: 'TXXXXX',       // ← ganti
    mode: 'sandbox'               // ganti 'production' saat live
  },
  // Admin default
  adminUser: 'admin',
  adminPass: 'admin123',
  // Biaya admin per transaksi
  adminFee: 1500
};

// ============================================================
// DATA PRODUK (simulasi data dari API Digiflazz)
// ============================================================
const OPERATORS = {
  telkomsel: { name: 'Telkomsel', prefix: ['0811','0812','0813','0821','0822','0823','0851','0852','0853'], color: '#ff3d00', icon: 'fas fa-signal' },
  indosat: { name: 'Indosat', prefix: ['0814','0815','0816','0855','0856','0857','0858'], color: '#ffd600', icon: 'fas fa-signal' },
  xl: { name: 'XL / Axis', prefix: ['0817','0818','0819','0859','0877','0878'], color: '#2979ff', icon: 'fas fa-signal' },
  tri: { name: 'Tri', prefix: ['0895','0896','0897','0898','0899'], color: '#e91e63', icon: 'fas fa-signal' },
  smartfren: { name: 'Smartfren', prefix: ['0881','0882','0883','0884','0885','0886','0887','0888','0889'], color: '#e040fb', icon: 'fas fa-signal' }
};

// Generate data produk pulsa
function generatePulsaProducts() {
  const products = [];
  const nominals = [
    {nom:5000, price:5800}, {nom:10000, price:10800}, {nom:15000, price:15700},
    {nom:20000, price:20600}, {nom:25000, price:25500}, {nom:50000, price:50500},
    {nom:100000, price:100500}
  ];
  Object.entries(OPERATORS).forEach(([key, op]) => {
    nominals.forEach((n, i) => {
      products.push({
        id: `pulsa-${key}-${n.nom}`, category: 'pulsa', operator: key,
        operatorName: op.name, name: `Pulsa ${op.name} ${formatRupiah(n.nom)}`,
        nominal: n.nom, price: n.price, sku: `TLK${key.toUpperCase()}${n.nom}`
      });
    });
  });
  return products;
}

function generatePaketDataProducts() {
  const products = [];
  const pkts = {
    telkomsel: [
      {name:'1GB 30hr', price:12000}, {name:'3GB 30hr', price:25000},
      {name:'5GB 30hr', price:38000}, {name:'10GB 30hr', price:65000}, {name:'25GB 30hr', price:100000}
    ],
    indosat: [
      {name:'1GB 30hr', price:11000}, {name:'3GB 30hr', price:23000},
      {name:'5GB 30hr', price:35000}, {name:'10GB 30hr', price:60000}, {name:'25GB 30hr', price:95000}
    ],
    xl: [
      {name:'1GB 30hr', price:10500}, {name:'3GB 30hr', price:22000},
      {name:'5GB 30hr', price:33000}, {name:'10GB 30hr', price:58000}, {name:'25GB 30hr', price:90000}
    ],
    tri: [
      {name:'1GB 30hr', price:10000}, {name:'3GB 30hr', price:20000},
      {name:'5GB 30hr', price:30000}, {name:'10GB 30hr', price:55000}, {name:'25GB 30hr', price:85000}
    ],
    smartfren: [
      {name:'1GB 30hr', price:10000}, {name:'3GB 30hr', price:21000},
      {name:'5GB 30hr', price:32000}, {name:'10GB 30hr', price:56000}, {name:'25GB 30hr', price:88000}
    ]
  };
  Object.entries(pkts).forEach(([op, list]) => {
    list.forEach((p, i) => {
      products.push({
        id: `paket-${op}-${i}`, category: 'paket-data', operator: op,
        operatorName: OPERATORS[op].name, name: `${OPERATORS[op].name} ${p.name}`,
        nominal: null, price: p.price, sku: `PKT${op.toUpperCase()}${i}`
      });
    });
  });
  return products;
}

function generateEwalletProducts() {
  const products = [];
  const wallets = {
    gopay: {name:'GoPay', nominals:[10000,20000,50000,100000,200000]},
    ovo: {name:'OVO', nominals:[10000,20000,50000,100000,200000]},
    dana: {name:'DANA', nominals:[10000,20000,50000,100000,200000]},
    shopeepay: {name:'ShopeePay', nominals:[10000,20000,50000,100000,200000]}
  };
  Object.entries(wallets).forEach(([key, w]) => {
    w.nominals.forEach(n => {
      products.push({
        id: `ew-${key}-${n}`, category: 'e-wallet', operator: key,
        operatorName: w.name, name: `${w.name} ${formatRupiah(n)}`,
        nominal: n, price: n + 1500, sku: `EW${key.toUpperCase()}${n}`
      });
    });
  });
  return products;
}

function generateTokenPLN() {
  const nominals = [20000,50000,100000,200000,500000,1000000];
  return nominals.map(n => ({
    id: `pln-${n}`, category: 'token-pln', operator: 'pln',
    operatorName: 'PLN', name: `Token PLN ${formatRupiah(n)}`,
    nominal: n, price: n + 2000, sku: `PLN${n}`
  }));
}

const ALL_PRODUCTS = [
  ...generatePulsaProducts(),
  ...generatePaketDataProducts(),
  ...generateEwalletProducts(),
  ...generateTokenPLN()
];

const CATEGORIES = [
  { id: 'pulsa', name: 'Pulsa', icon: 'fas fa-mobile-screen', desc: 'Isi ulang pulsa semua operator' },
  { id: 'paket-data', name: 'Paket Data', icon: 'fas fa-wifi', desc: 'Internet murah & cepat' },
  { id: 'e-wallet', name: 'E-Wallet', icon: 'fas fa-wallet', desc: 'Top up GoPay, OVO, DANA' },
  { id: 'token-pln', name: 'Token PLN', icon: 'fas fa-bolt', desc: 'Token listrik prabayar' }
];

const PAYMENT_METHODS = [
  { id: 'qris', name: 'QRIS', icon: 'fas fa-qrcode', desc: 'Scan QR dari aplikasi apapun' },
  { id: 'gopay', name: 'GoPay', icon: 'fas fa-wallet', desc: 'Bayar via GoPay / GoPayLater' },
  { id: 'ovo', name: 'OVO', icon: 'fas fa-money-bill', desc: 'Bayar via aplikasi OVO' },
  { id: 'dana', name: 'DANA', icon: 'fas fa-coins', desc: 'Bayar via aplikasi DANA' },
  { id: 'bank', name: 'Transfer Bank', icon: 'fas fa-building-columns', desc: 'BCA, BNI, BRI, Mandiri' }
];

// ============================================================
// DATABASE LAYER (localStorage — ganti dengan API backend)
// ============================================================
const DB = {
  _get(key) { try { return JSON.parse(localStorage.getItem(`pulsaku_${key}`)) || null; } catch { return null; } },
  _set(key, val) { localStorage.setItem(`pulsaku_${key}`, JSON.stringify(val)); },

  getTransactions() { return this._get('transactions') || []; },
  saveTransaction(tx) {
    const list = this.getTransactions();
    list.unshift(tx);
    this._set('transactions', list);
    return tx;
  },
  updateTransaction(id, updates) {
    const list = this.getTransactions();
    const idx = list.findIndex(t => t.id === id);
    if (idx !== -1) { Object.assign(list[idx], updates); this._set('transactions', list); }
    return list[idx];
  },
  getTransaction(id) { return this.getTransactions().find(t => t.id === id); },

  getSettings() {
    return this._get('settings') || {
      digiflazz_user: CONFIG.digiflazz.username,
      digiflazz_key: CONFIG.digiflazz.apiKey,
      tripay_key: CONFIG.tripay.apiKey,
      tripay_private: CONFIG.tripay.privateKey,
      tripay_merchant: CONFIG.tripay.merchantCode,
      tripay_mode: CONFIG.tripay.mode,
      admin_fee: CONFIG.adminFee
    };
  },
  saveSettings(s) { this._set('settings', s); },

  getAdminSession() { return this._get('admin_session'); },
  setAdminSession(v) { this._set('admin_session', v); },
  clearAdminSession() { localStorage.removeItem('pulsaku_admin_session'); }
};

// ============================================================
// MOCK API LAYER
// — Ganti fungsi-fungsi ini dengan fetch() ke backend Anda
// — Backend Anda yang memanggil Digiflazz/Tripay API secara aman
// ============================================================
const API = {
  // Cek harga produk (simulasi Digiflazz /price-list)
  async checkPrice(sku) {
    await delay(300);
    const p = ALL_PRODUCTS.find(pr => pr.sku === sku);
    if (!p) throw new Error('Produk tidak ditemukan');
    return { ...p, status: 'available' };

    /* === CONTOH IMPLEMENTASI SUNGGUHAN (via backend Anda) ===
    const res = await fetch('/api/price-list', {
      headers: { 'Authorization': 'Bearer ' + DB.getSettings().digiflazz_key }
    });
    return res.json();
    */
  },

  // Buat transaksi (simulasi Digiflazz /transaction)
  async createTransaction(data) {
    await delay(800);
    const txId = 'TX' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substr(2,4).toUpperCase();
    const tx = {
      id: txId,
      product: data.product,
      customer_id: data.phone || data.customerId,
      price: data.price,
      admin_fee: DB.getSettings().admin_fee,
      total: data.price + DB.getSettings().admin_fee,
      payment_method: data.paymentMethod,
      status: 'pending',
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString(),
      sn: null, // serial number, diisi setelah sukses
      note: null
    };
    DB.saveTransaction(tx);
    return tx;

    /* === CONTOH IMPLEMENTASI SUNGGUHAN ===
    const res = await fetch('/api/transaction', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: DB.getSettings().digiflazz_user,
        buyer_sku_code: data.sku,
        customer_no: data.phone,
        ref_id: txId
      })
    });
    return res.json();
    */
  },

  // Buat pembayaran (simulasi Tripay /transaction/create)
  async createPayment(txId, method) {
    await delay(600);
    const tx = DB.getTransaction(txId);
    if (!tx) throw new Error('Transaksi tidak ditemukan');
    const payRef = 'PAY' + Date.now().toString(36).toUpperCase();
    DB.updateTransaction(txId, {
      payment_ref: payRef,
      payment_expires: new Date(Date.now() + 15*60*1000).toISOString(),
      qr_string: `pulsaku:${txId}:${payRef}:${tx.total}` // simulasi QR payload
    });
    return DB.getTransaction(txId);

    /* === CONTOH IMPLEMENTASI SUNGGUHAN (Tripay) ===
    const settings = DB.getSettings();
    const res = await fetch(`https://tripay.co.id/api-sandbox/transaction/create`, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + settings.tripay_key,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        method: method,
        merchant_ref: txId,
        amount: tx.total,
        customer_name: 'Customer',
        order_items: [{ name: tx.product.name, price: tx.price, quantity: 1 }],
        callback_url: 'https://domainanda.com/callback',
        return_url: 'https://domainanda.com/return',
        expired_time: 900 // 15 menit
      })
    });
    return res.json();
    */
  },

  // Cek status transaksi (simulasi polling)
  async checkStatus(txId) {
    await delay(400);
    return DB.getTransaction(txId);

    /* === CONTOH IMPLEMENTASI SUNGGUHAN ===
    const res = await fetch(`/api/transaction/${txId}/status`);
    return res.json();
    */
  },

  // Simulasi pembayaran berhasil (untuk demo)
  simulatePayment(txId) {
    const sn = 'SN' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substr(2,6).toUpperCase();
    return DB.updateTransaction(txId, {
      status: 'success',
      sn: sn,
      note: 'Transaksi berhasil diproses',
      updated_at: new Date().toISOString(),
      paid_at: new Date().toISOString()
    });
  }
};

// ============================================================
// UTILITY FUNCTIONS
// ============================================================
function formatRupiah(n) {
  return 'Rp' + Number(n).toLocaleString('id-ID');
}
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }) +
    ' ' + d.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
}
function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'baru saja';
  if (s < 3600) return Math.floor(s/60) + ' menit lalu';
  if (s < 86400) return Math.floor(s/3600) + ' jam lalu';
  return Math.floor(s/86400) + ' hari lalu';
}
function detectOperator(phone) {
  const p = phone.replace(/\D/g,'');
  for (const [key, op] of Object.entries(OPERATORS)) {
    if (op.prefix.some(pre => p.startsWith(pre))) return key;
  }
  return null;
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,6); }

// Toast notification
function toast(msg, type='success') {
  const c = document.getElementById('toast-container');
  const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', info:'fa-info-circle', warning:'fa-exclamation-triangle' };
  const colors = { success:'var(--accent)', error:'var(--danger)', info:'var(--info)', warning:'var(--warn)' };
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<i class="fas ${icons[type]}" style="color:${colors[type]};font-size:18px"></i><span style="color:var(--text);font-size:14px">${msg}</span>`;
  c.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 3500);
}

  document.getElementById('modal-container').innerHTML =

function navigate(page, data) {
  if (statusPolling) { clearInterval(statusPolling); statusPolling = null; }

  // Update nav active state
  document.querySelectorAll('.nav-link[data-page]').forEach(el => {

}

function render() {
  const app = document.getElementById('app');
  // Sembunyikan nav untuk halaman admin dashboard
  const hideNav = ['admin'].includes(currentPage);

  switch(currentPage) {

async function processOrder() {
  const btn = document.getElementById('btn-pay');
  if (!btn || !orderState.paymentMethod) return;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Memproses...';

  try {
    // 1. Buat transaksi
    const tx = await API.createTransaction({
      product: orderState.product,
      phone: orderState.phone,
      sku: orderState.product.sku,
      price: orderState.product.price,
      paymentMethod: orderState.paymentMethod
    });
    orderState.txId = tx.id;

    // 2. Buat pembayaran
    const payTx = await API.createPayment(tx.id, orderState.paymentMethod);

    toast('Pesanan dibuat, silakan lakukan pembayaran', 'success');
    navigate('pembayaran');
  } catch(e) {
    toast('Gagal membuat pesanan: ' + e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = `<i class="fas fa-lock mr-2"></i>Bayar ${formatRupiah(orderState.product.price + DB.getSettings().admin_fee)}`;
  }
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Disalin ke clipboard', 'info')).catch(() => {});
}

// Timer countdown
setInterval(() => {
  const el = document.getElementById('pay-timer');
  if (!el) return;
  const exp = new Date(el.dataset.expires);
  const diff = Math.max(0, Math.floor((exp - Date.now()) / 1000));
  const m = String(Math.floor(diff / 60)).padStart(2, '0');
  const s = String(diff % 60).padStart(2, '0');
  el.textContent = `${m}:${s}`;
  if (diff <= 60) el.style.color = 'var(--danger)';
  if (diff <= 0) el.textContent = 'Waktu Habis';
}, 1000);

// Generate QR Code setelah render
const origRender = render;
// QR akan di-generate via MutationObserver
const qrObserver = new MutationObserver(() => {
  const qrEl = document.getElementById('qr-code');
  if (qrEl && qrEl.childNodes.length === 0) {
    const tx = orderState.txId ? DB.getTransaction(orderState.txId) : null;
    if (tx?.qr_string) {
      new QRCode(qrEl, {
        text: tx.qr_string,
        width: 200,
        height: 200,
        colorDark: '#060d09',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }
  }
});
qrObserver.observe(document.getElementById('app'), { childList: true, subtree: true });

function togglePassVisibility(btn) {
  const input = btn.parentElement.querySelector('input');
  const icon = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text'; icon.className = 'fas fa-eye-slash';
  } else {
    input.type = 'password'; icon.className = 'fas fa-eye';
  }
}

function doAdminLogin() {
  const user = document.getElementById('admin-user')?.value;
  const pass = document.getElementById('admin-pass')?.value;
  const settings = DB.getSettings();
  // Cek apakah admin user/pass sudah diubah di settings
  const validUser = settings.admin_user || CONFIG.adminUser;
  const validPass = settings.admin_pass || CONFIG.adminPass;
  if (user === validUser && pass === validPass) {
    DB.setAdminSession({ user, loginAt: new Date().toISOString() });
    toast('Login berhasil', 'success');
    navigate('admin');
  } else {
    toast('Username atau password salah', 'error');
  }
}

                <td>${tx.status==='success'?'<span class="badge badge-success">Berhasil</span>':tx.status==='pending'?'<span class="badge badge-pending">Pending</span>':'<span class="badge badge-fail">Gagal</span>'}</td>
                <td class="text-xs">${timeAgo(tx.created_at)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
  `;
}

function adminTransactions(txs) {
  return `

    <div class="flex flex-col sm:flex-row gap-3 mb-4">
      <input id="tx-search" type="text" class="input-field" placeholder="Cari ID, produk, atau nomor..." oninput="filterTxTable(this.value)">

      <table id="tx-table">
        <thead><tr><th>ID</th><th>Produk</th><th>Tujuan</th><th>Bayar</th><th>Metode</th><th>Status</th><th>Waktu</th><th>Aksi</th></tr></thead>
        <tbody>
          ${txs.map(tx => `
            <tr data-status="${tx.status}" data-search="${tx.id} ${tx.product.name} ${tx.customer_id}">

              <td class="text-sm">${tx.product.name}</td>

              <td>${tx.status==='success'?'<span class="badge badge-success">Berhasil</span>':tx.status==='pending'?'<span class="badge badge-pending">Pending</span>':'<span class="badge badge-fail">Gagal</span>'}</td>
              <td class="text-xs whitespace-nowrap">${formatDate(tx.created_at)}</td>
              <td>
                <button class="text-xs px-2 py-1 rounded" style="color:var(--accent);background:var(--accent-glow)" onclick="showTxDetail('${tx.id}')">
                  <i class="fas fa-eye"></i>
                </button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}

function filterTxTable(query) {
  const status = document.getElementById('tx-filter')?.value || 'all';
  const q = query.toLowerCase();
  document.querySelectorAll('#tx-table tbody tr').forEach(tr => {
    const matchSearch = !q || (tr.dataset.search || '').toLowerCase().includes(q);
    const matchStatus = status === 'all' || tr.dataset.status === status;
    tr.style.display = matchSearch && matchStatus ? '' : 'none';
  });
}

  s.tripay_merchant = document.getElementById('set-tp-merchant')?.value || '';
  s.tripay_mode = document.getElementById('set-tp-mode')?.value || 'sandbox';
  s.admin_fee = parseInt(document.getElementById('set-fee')?.value) || 0;
  const newPass = document.getElementById('set-new-pass')?.value;

}

// ============================================================
// CHART (Admin Overview)
// ============================================================
function initChart() {
  const canvas = document.getElementById('chart-revenue');
  if (!canvas) return;
  const txs = DB.getTransactions().filter(t => t.status === 'success');
  // Data 7 hari terakhir
  const days = [];
  const revenue = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0,10);
    days.push(d.toLocaleDateString('id-ID', { weekday:'short', day:'numeric' }));
    revenue.push(txs.filter(t => t.created_at.slice(0,10) === key).reduce((s,t) => s + t.total, 0));
  }

  new Chart(canvas, {
    type: 'bar',
    data: {
      labels: days,
      datasets: [{
        label: 'Pendapatan',
        data: revenue,
        backgroundColor: 'rgba(0,230,118,0.3)',
        borderColor: 'rgba(0,230,118,0.8)',
        borderWidth: 2,
        borderRadius: 6,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color:'rgba(30,51,38,0.5)' }, ticks: { color:'#4a6e56', font:{size:11} } },
        y: {
          grid: { color:'rgba(30,51,38,0.5)' },
          ticks: {
            color: '#4a6e56',
            font: { size:11 },
            callback: v => v >= 1000 ? 'Rp' + (v/1000) + 'k' : 'Rp' + v
          }
        }
      }
    }
  });
}

// Init chart setelah render
const chartObserver = new MutationObserver(() => {
  if (document.getElementById('chart-revenue')) {
    setTimeout(initChart, 100);
  }
});
chartObserver.observe(document.getElementById('app'), { childList: true, subtree: true });

function seedDemoData() {
  const demoProducts = [
    ALL_PRODUCTS.find(p => p.id === 'pulsa-telkomsel-50000'),
    ALL_PRODUCTS.find(p => p.id === 'pulsa-indosat-25000'),
    ALL_PRODUCTS.find(p => p.id === 'paket-data-xl-2'),
    ALL_PRODUCTS.find(p => p.id === 'ew-gopay-50000'),
    ALL_PRODUCTS.find(p => p.id === 'pulsa-tri-10000'),
    ALL_PRODUCTS.find(p => p.id === 'token-pln-100000'),
    ALL_PRODUCTS.find(p => p.id === 'pulsa-smartfren-20000'),
    ALL_PRODUCTS.find(p => p.id === 'ew-dana-100000'),
  ];
  const phones = ['081234567890','081598765432','081788778877','089512345678','081299887766','088877665544','085311223344','087744556677'];
  const methods = ['qris','gopay','ovo','dana','bank'];
  const statuses = ['success','success','success','success','success','pending','failed','success'];
  const fee = CONFIG.adminFee;

  demoProducts.forEach((prod, i) => {
    if (!prod) return;
    const daysAgo = Math.floor(Math.random() * 7);
    const date = new Date(); date.setDate(date.getDate() - daysAgo);
    date.setHours(Math.floor(Math.random()*14)+8, Math.floor(Math.random()*60));
    const tx = {
      id: 'TX' + (Date.now() - i*100000).toString(36).toUpperCase() + Math.random().toString(36).substr(2,3).toUpperCase(),
      product: prod,
      customer_id: phones[i],
      price: prod.price,
      admin_fee: fee,
      total: prod.price + fee,
      payment_method: methods[i % methods.length],
      status: statuses[i],
      created_at: date.toISOString(),
      updated_at: date.toISOString(),
      sn: statuses[i]==='success' ? 'SN'+Math.random().toString(36).substr(2,10).toUpperCase() : null,
      note: statuses[i]==='failed' ? 'Saldo provider tidak mencukupi' : null,
      payment_ref: 'PAY' + Math.random().toString(36).substr(2,8).toUpperCase(),
      payment_expires: new Date(date.getTime() + 15*60*1000).toISOString(),
      qr_string: `pulsaku:demo:${i}:${prod.price}`,
      paid_at: statuses[i]==='success' ? new Date(date.getTime() + 30000).toISOString() : null
    };
    DB.saveTransaction(tx);
  });
}

// Jalankan aplikasi
initApp();
